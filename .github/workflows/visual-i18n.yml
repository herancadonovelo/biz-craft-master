name: Visual & i18n layout

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: visual-i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Playwright · screenshots PT/EN
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      PLAYWRIGHT_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      # Falha o build assim que houver divergência de layout após troca de
      # idioma (screenshots PT/EN fora da baseline).
      - name: Run visual & i18n specs
        run: bun run test:visual
      - name: Visual & i18n report
        if: always()
        run: |
          node scripts/visual-i18n-report.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-i18n-report
          path: |
            reports/visual-i18n-report.md
            playwright-report/html
          if-no-files-found: ignore
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/**
          if-no-files-found: ignore